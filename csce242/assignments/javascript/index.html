<!DOCTYPE html>
<html>
    <head>
        <title>JavaScript Buttons, Functions, and More</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div id="content">
            <header id="main-header">
                <div class="options-menu">&#8226;&#8226;&#8226;</div>
                <h1>JavaScript</h1>
                <h2 id="page-title">Introduction to JavaScript</h2>
            </header>
            <main>
                <div class="projects">

                    <section class="project-card" id="card-speech">
                        <h3>Speech</h3>
                        <div class="card-body">
                            <div class="speech-bubble" id="speech-bubble">Hi</div>
                        </div>
                    </section>

                    <section class="project-card" id="card-beverage">
                        <h3>Beverage</h3>
                        <div class="card-body">
                            <label for="beverage-select">Pick your morning beverage:</label>
                            <select id="beverage-select">
                                <option value="Coffee">Coffee</option>
                                <option value="Tea">Tea</option>
                                <option value="Orange Juice">Orange Juice</option>
                                <option value="Water">Water</option>
                                <option value="Smoothie">Smoothie</option>
                                <option value="Milkshake">Milkshake</option>
                            </select>
                            <p id="beverage-message"></p>
                        </div>
                    </section>

                    <section class="project-card" id="card-sticker">
                        <h3>Add a Sticker</h3>
                        <div class="card-body sticker-wrapper" id="sticker-wrapper">
                            <img src="image/js.png" alt="Sticker" id="javascript">
                        </div>
                    </section>

                </div>
            </main>
            <footer id="main-footer">
                <p>&#64;kevinbenii.com</p>
            </footer>
        </div>
        <script src="scripts/script.js"></script>
    </body>
</html>
